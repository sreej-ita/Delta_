services:
  backend:
    build:
      context: ./backend
    container_name: projectdelta-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/gee-service-account.json:/app/gee-service-account.json:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: projectdelta-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped